{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>{% block title %}Ismael Pessoa — Fotografia{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}scan-page{% endblock %}">
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'scan' %}" class="logo">
                <span class="logo-mark">IP</span>
                <span class="logo-text">Ismael Pessoa</span>
            </a>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-copy">&copy; 2026 Ismael Pessoa — Fotografia de Eventos.</p>
            <p class="footer-note">Suas fotos, seu evento. Protegidas com marca d'água.</p>
        </div>
    </footer>

    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
